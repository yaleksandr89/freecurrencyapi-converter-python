name: Ошибка
description: Сообщить о воспроизводимой ошибке CLI
body:
  - type: markdown
    attributes:
      value: |
        Удалите ключи API и приватные данные. Не прикладывайте полный `.env`.
  - type: input
    id: python
    attributes:
      label: Версия Python
      placeholder: "3.12.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ОС и терминал
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Команда и флаги
      placeholder: python index.py --lang en
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите примеры ввода
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Ожидаемый и фактический вывод
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журналы без секретов
      render: text
