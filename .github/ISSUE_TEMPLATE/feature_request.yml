name: Предложение
description: Предложить улучшение CLI
body:
  - type: textarea
    id: use-case
    attributes:
      label: Проблема или сценарий
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Желаемое поведение
      description: Приведите пример ввода или вывода CLI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и последствия
      description: Укажите обходные варианты или изменения текущего поведения
