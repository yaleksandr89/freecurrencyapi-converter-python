# Setuptools builds wheels and supports editable installs.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-converter"
version = "0.1.0"
description = "Interactive Python CLI currency converter using FreecurrencyAPI exchange rates"
readme = "README.md"
authors = [{name = "Александр Юрченко", email = "y.aleksandr89@yandex.ru"}]
keywords = ["currency-converter", "currency-exchange", "exchange-rates", "freecurrencyapi", "python", "cli"]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[project.urls]
Homepage = "https://github.com/yaleksandr89/freecurrencyapi-converter-python"
Repository = "https://github.com/yaleksandr89/freecurrencyapi-converter-python"
Documentation = "https://github.com/yaleksandr89/freecurrencyapi-converter-python/blob/master/docs/guides/getting-started.md"
Issues = "https://github.com/yaleksandr89/freecurrencyapi-converter-python/issues"
Discussions = "https://github.com/yaleksandr89/freecurrencyapi-converter-python/discussions"
Security = "https://github.com/yaleksandr89/freecurrencyapi-converter-python/security/policy"
Author = "https://github.com/yaleksandr89"

# Discover regular packages under the src directory.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# Limit test discovery to the test suite.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Keep linting and formatting compatible with Python 3.12.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
